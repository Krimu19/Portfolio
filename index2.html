<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes qualités</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrap">
  <div class="qualities" id="qualities">

    <div class="crop dynamique" data-x="50" data-w="307.7">
      <div class="fx-layer" id="speedLayer"></div>
    </div>

    <div class="crop passionne" data-x="357.7" data-w="307.7">
      <div class="fx-layer">
        <div class="flame-glow"></div>
      </div>
    </div>

    <div class="crop motivee" data-x="665.4" data-w="307.7">
      <div class="fx-layer">
        <div class="exhaust-glow"></div>
      </div>
    </div>

    <div class="crop ecoute" data-x="973.1" data-w="307.7">
      <div class="fx-layer">
        <div class="wave-ring" style="animation-delay:0s;"></div>
        <div class="wave-ring" style="animation-delay:0.8s;"></div>
        <div class="wave-ring" style="animation-delay:1.6s;"></div>
      </div>
    </div>

    <div class="crop creative" data-x="1280.9" data-w="307.7">
      <div class="fx-layer" id="sparkleLayer">
        <div class="ink-glow"></div>
      </div>
    </div>

    <div class="crop adaptable" data-x="1588.6" data-w="307.7">
      <div class="fx-layer"></div>
    </div>

    <div class="crop autonome" data-x="1896.3" data-w="307.7">
      <div class="fx-layer">
        <div class="screen-glow"></div>
      </div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
