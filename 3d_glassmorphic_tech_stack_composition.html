<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Floating Glassmorphic Tech Stack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #030108;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient background glowing spots */
    .bg-glow-1 {
      position: absolute;
      top: 20%;
      left: 15%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.28) 0%, rgba(79, 70, 229, 0.08) 50%, transparent 70%);
      filter: blur(60px);
      pointer-events: none;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: 15%;
      right: 20%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.2) 0%, rgba(59, 130, 246, 0.05) 50%, transparent 70%);
      filter: blur(70px);
      pointer-events: none;
    }

    /* 3D Scene Wrapper */
    .scene-container {
      width: 100%;
      max-width: 900px;
      height: 800px;
      position: relative;
      perspective: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .stage-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.15s cubic-bezier(0.1, 0.8, 0.3, 1);
    }

    /* Base Glass Card Styles */
    .glass-card {
      position: absolute;
      transform-style: preserve-3d;
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(168, 85, 247, 0.06) 40%,
        rgba(15, 10, 30, 0.65) 100%
      );
      border: 1px solid rgba(216, 180, 254, 0.35);
      border-top: 1.5px solid rgba(255, 255, 255, 0.6);
      border-left: 1.5px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        -15px 25px 50px rgba(0, 0, 0, 0.85),
        0 10px 30px rgba(126, 34, 206, 0.25),
        inset 0 1px 2px rgba(255, 255, 255, 0.6),
        inset 0 -2px 6px rgba(147, 51, 234, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: box-shadow 0.3s ease, border-color 0.3s ease;
    }

    /* Thick 3D Glass Slab Edges */
    .glass-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1.5px;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.8),
        rgba(192, 132, 252, 0.4) 40%,
        rgba(126, 34, 206, 0.1)
      );
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    /* Light Reflection Highlight */
    .glass-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 45%;
      background: linear-gradient(
        180deg,
        rgba(255, 255, 255, 0.18) 0%,
        rgba(255, 255, 255, 0) 100%
      );
      border-radius: inherit;
      pointer-events: none;
    }

    .glass-card:hover {
      border-color: rgba(233, 213, 255, 0.6);
      box-shadow: 
        -20px 30px 60px rgba(0, 0, 0, 0.9),
        0 0 35px rgba(168, 85, 247, 0.45),
        inset 0 1px 3px rgba(255, 255, 255, 0.8);
    }

    /* Specific Card Sizes & Positions (Replicating Reference) */

    /* 1. GitHub (Top Center Large Card) */
    .card-github {
      width: 250px;
      height: 250px;
      border-radius: 42px;
      top: 15%;
      left: 28%;
      transform: translateZ(90px) rotateX(16deg) rotateY(-18deg) rotateZ(6deg);
      animation: floatGithub 6s ease-in-out infinite;
      z-index: 50;
    }

    /* 2. React (Top Right Hexagon) */
    .card-react {
      width: 120px;
      height: 120px;
      border-radius: 28px;
      clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
      top: 8%;
      left: 64%;
      transform: translateZ(120px) rotateX(14deg) rotateY(-16deg) rotateZ(4deg);
      animation: floatReact 5.5s ease-in-out infinite;
      z-index: 60;
      background: linear-gradient(135deg, rgba(97, 218, 251, 0.15) 0%, rgba(147, 51, 234, 0.12) 100%);
    }

    /* 3. JavaScript Shield (Middle Left) */
    .card-js {
      width: 180px;
      height: 230px;
      border-radius: 32px;
      top: 36%;
      left: 17%;
      transform: translateZ(30px) rotateX(18deg) rotateY(-20deg) rotateZ(8deg);
      animation: floatJS 6.5s ease-in-out infinite;
      z-index: 20;
    }

    /* 4. CSS3 Shield (Middle Right) */
    .card-css {
      width: 210px;
      height: 270px;
      border-radius: 36px;
      top: 28%;
      left: 53%;
      transform: translateZ(40px) rotateX(18deg) rotateY(-20deg) rotateZ(8deg);
      animation: floatCSS 6.2s ease-in-out infinite;
      z-index: 30;
      background: linear-gradient(135deg, rgba(41, 101, 241, 0.15) 0%, rgba(126, 34, 206, 0.1) 100%);
    }

    /* 5. HTML5 Shield (Front Bottom Center) */
    .card-html {
      width: 240px;
      height: 250px;
      border-radius: 40px;
      top: 52%;
      left: 31%;
      transform: translateZ(110px) rotateX(14deg) rotateY(-16deg) rotateZ(5deg);
      animation: floatHTML 5.8s ease-in-out infinite;
      z-index: 70;
    }

    /* 6. Bitwarden Hexagon (Bottom Right Badge) */
    .card-bitwarden {
      width: 135px;
      height: 135px;
      border-radius: 28px;
      clip-path: polygon(50% 0%, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%);
      top: 72%;
      left: 61%;
      transform: translateZ(80px) rotateX(16deg) rotateY(-18deg) rotateZ(7deg);
      animation: floatBitwarden 6.4s ease-in-out infinite;
      z-index: 60;
      background: linear-gradient(135deg, rgba(23, 93, 220, 0.2) 0%, rgba(147, 51, 234, 0.1) 100%);
    }

    /* Unique Floating Keyframe Animations */
    @keyframes floatGithub {
      0%, 100% { transform: translateZ(90px) rotateX(16deg) rotateY(-18deg) rotateZ(6deg) translateY(0px); }
      50% { transform: translateZ(90px) rotateX(16deg) rotateY(-18deg) rotateZ(6deg) translateY(-14px); }
    }

    @keyframes floatReact {
      0%, 100% { transform: translateZ(120px) rotateX(14deg) rotateY(-16deg) rotateZ(4deg) translateY(0px); }
      50% { transform: translateZ(120px) rotateX(14deg) rotateY(-16deg) rotateZ(4deg) translateY(-10px); }
    }

    @keyframes floatJS {
      0%, 100% { transform: translateZ(30px) rotateX(18deg) rotateY(-20deg) rotateZ(8deg) translateY(0px); }
      50% { transform: translateZ(30px) rotateX(18deg) rotateY(-20deg) rotateZ(8deg) translateY(-16px); }
    }

    @keyframes floatCSS {
      0%, 100% { transform: translateZ(40px) rotateX(18deg) rotateY(-20deg) rotateZ(8deg) translateY(0px); }
      50% { transform: translateZ(40px) rotateX(18deg) rotateY(-20deg) rotateZ(8deg) translateY(-12px); }
    }

    @keyframes floatHTML {
      0%, 100% { transform: translateZ(110px) rotateX(14deg) rotateY(-16deg) rotateZ(5deg) translateY(0px); }
      50% { transform: translateZ(110px) rotateX(14deg) rotateY(-16deg) rotateZ(5deg) translateY(-15px); }
    }

    @keyframes floatBitwarden {
      0%, 100% { transform: translateZ(80px) rotateX(16deg) rotateY(-18deg) rotateZ(7deg) translateY(0px); }
      50% { transform: translateZ(80px) rotateX(16deg) rotateY(-18deg) rotateZ(7deg) translateY(-11px); }
    }

    /* Logo SVGs Styling */
    .icon-svg {
      filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.6));
      transition: transform 0.3s ease;
    }

    .glass-card:hover .icon-svg {
      transform: scale(1.08) translateZ(10px);
    }
  </style>
</head>
<body>

  <!-- Ambient Lights -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Interactive 3D Canvas -->
  <div class="scene-container" id="sceneContainer">
    <div class="stage-3d" id="stage3d">

      <!-- 1. GITHUB CARD (Top Center) -->
      <div class="glass-card card-github">
        <svg class="icon-svg" width="130" height="130" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="gh-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="60%" stop-color="#e9d5ff" />
              <stop offset="100%" stop-color="#c084fc" />
            </linearGradient>
          </defs>
          <path fill-rule="evenodd" clip-rule="evenodd" d="M50 10C27.9 10 10 27.9 10 50c0 17.7 11.5 32.7 27.4 38 2 .4 2.7-.9 2.7-1.9 0-1-.1-4.3-.1-7.8-11.1 2.4-13.5-4.7-13.5-4.7-1.8-4.6-4.4-5.8-4.4-5.8-3.6-2.5.3-2.4.3-2.4 4 0 6.1 4.1 6.1 4.1 3.6 6.1 9.4 4.4 11.7 3.3.4-2.6 1.4-4.4 2.6-5.4-8.9-1-18.2-4.4-18.2-19.8 0-4.4 1.6-8 4.1-10.8-.4-1-.18-5.1.4-10.6 0 0 3.4-1.1 11.1 4.1 3.2-.9 6.7-1.3 10.1-1.3 3.4 0 6.9.4 10.1 1.3 7.7-5.2 11.1-4.1 11.1-4.1 1.8 5.5 1.8 9.6 1.4 10.6 2.6 2.8 4.1 6.4 4.1 10.8 0 15.4-9.4 18.8-18.3 19.8 1.4 1.2 2.7 3.6 2.7 7.3 0 5.3-.1 9.6-.1 10.9 0 1 .7 2.3 2.8 1.9C78.5 82.7 90 67.7 90 50 90 27.9 72.1 10 50 10z" fill="url(#gh-grad)"/>
        </svg>
      </div>

      <!-- 2. REACT BADGE (Top Right Hexagon) -->
      <div class="glass-card card-react">
        <svg class="icon-svg" width="60" height="60" viewBox="0 0 100 100" fill="none">
          <ellipse cx="50" cy="50" rx="40" ry="16" stroke="#61DAFB" stroke-width="4.5"/>
          <ellipse cx="50" cy="50" rx="40" ry="16" stroke="#61DAFB" stroke-width="4.5" transform="rotate(60 50 50)"/>
          <ellipse cx="50" cy="50" rx="40" ry="16" stroke="#61DAFB" stroke-width="4.5" transform="rotate(120 50 50)"/>
          <circle cx="50" cy="50" r="8" fill="#61DAFB"/>
        </svg>
      </div>

      <!-- 3. JAVASCRIPT SHIELD (Middle Left) -->
      <div class="glass-card card-js">
        <svg class="icon-svg" width="110" height="140" viewBox="0 0 100 120" fill="none">
          <!-- JS Shield outline -->
          <path d="M10 10 L90 10 L82 100 L50 112 L18 100 Z" fill="rgba(168, 85, 247, 0.15)" stroke="#c084fc" stroke-width="3"/>
          <path d="M50 15 L83 15 L76 94 L50 104 Z" fill="rgba(192, 132, 252, 0.2)"/>
          <!-- JS Text -->
          <text x="32" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="22" fill="#e9d5ff">JS</text>
          <text x="38" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="44" fill="#ffffff">JS</text>
        </svg>
      </div>

      <!-- 4. CSS3 SHIELD (Middle Right) -->
      <div class="glass-card card-css">
        <svg class="icon-svg" width="130" height="160" viewBox="0 0 100 120" fill="none">
          <defs>
            <linearGradient id="css-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#1d4ed8"/>
            </linearGradient>
          </defs>
          <!-- CSS Banner Text -->
          <text x="50" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#38bdf8" letter-spacing="1">CSS</text>
          <!-- 3D CSS Shield -->
          <path d="M15 32 L85 32 L78 102 L50 112 L22 102 Z" fill="url(#css-grad)"/>
          <path d="M50 37 L80 37 L74 97 L50 105 Z" fill="#2563eb"/>
          <!-- 3 Shield Number -->
          <path d="M32 48 H68 L66 62 H48 L49 72 H65 L63 90 L50 94 L37 90 L36 80 H46 L47 84 L50 85 L54 84 L55 78 H34 Z" fill="#ffffff"/>
        </svg>
      </div>

      <!-- 5. HTML5 SHIELD (Bottom Center Front) -->
      <div class="glass-card card-html">
        <svg class="icon-svg" width="140" height="170" viewBox="0 0 100 120" fill="none">
          <defs>
            <linearGradient id="html-grad-left" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#f97316"/>
              <stop offset="100%" stop-color="#ea580c"/>
            </linearGradient>
            <linearGradient id="html-grad-right" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fb923c"/>
              <stop offset="100%" stop-color="#f97316"/>
            </linearGradient>
          </defs>
          <!-- HTML Header -->
          <text x="50" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#ffffff" letter-spacing="1.5">HTML</text>
          <!-- 3D HTML Shield -->
          <path d="M15 30 L85 30 L78 102 L50 112 L22 102 Z" fill="url(#html-grad-left)"/>
          <path d="M50 35 L80 35 L74 97 L50 105 Z" fill="url(#html-grad-right)"/>
          <!-- 5 Number Badge -->
          <path d="M32 46 H68 L66 60 H36 L38 72 H65 L63 90 L50 94 L37 90 L36 80 H46 L47 84 L50 85 L54 84 L55 78 H34 Z" fill="#ffffff"/>
        </svg>
      </div>

      <!-- 6. BITWARDEN BADGE (Bottom Right Hexagon) -->
      <div class="glass-card card-bitwarden">
        <div class="flex flex-col items-center justify-center gap-1 mt-2">
          <svg class="icon-svg" width="50" height="50" viewBox="0 0 100 100" fill="none">
            <path d="M50 10 L15 25 V50 C15 72 30 90 50 95 C70 90 85 72 85 50 V25 L50 10 Z" fill="#175DDC"/>
            <path d="M50 20 L28 30 V50 C28 65 37 78 50 83 V20 Z" fill="#ffffff"/>
          </svg>
          <span style="font-size: 11px; font-weight: 700; color: #60a5fa; letter-spacing: 0.5px;">bitwarden</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Interactive 3D Parallax Effect on Mouse Movement
    const container = document.getElementById('sceneContainer');
    const stage = document.getElementById('stage3d');

    let mouseX = 0;
    let mouseY = 0;
    let currentX = 0;
    let currentY = 0;

    window.addEventListener('mousemove', (e) => {
      const rect = container.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      mouseX = (e.clientX - centerX) / (rect.width / 2);
      mouseY = (e.clientY - centerY) / (rect.height / 2);
    });

    function animateParallax() {
      // Smooth interpolation (lerp)
      currentX += (mouseX - currentX) * 0.08;
      currentY += (mouseY - currentY) * 0.08;

      const rotateY = currentX * 18; // Degrees tilt Y
      const rotateX = -currentY * 18; // Degrees tilt X

      stage.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

      requestAnimationFrame(animateParallax);
    }

    animateParallax();
  </script>
</body>
</html>
